<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="586" height="115" viewBox="0 0 586 115" role="img" aria-labelledby="title desc">
<title id="title">Chat with us on WhatsApp or Zalo</title>
<desc id="desc">A white floating speech-bubble contact bar with a chat icon, Chat with us label, and separated WhatsApp and Zalo icon buttons.</desc>

<defs>
  <filter id="soft-shadow" x="-22%" y="-38%" width="144%" height="194%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#192D43" flood-opacity="0.12"/>
  </filter>
  <filter id="badge-shadow" x="-35%" y="-35%" width="170%" height="185%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#092D50" flood-opacity="0.20"/>
  </filter>
  <linearGradient id="wa-green" x1="0" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#27E873"/><stop offset="0.52" stop-color="#08B757"/><stop offset="1" stop-color="#019849"/></linearGradient>
  <linearGradient id="zalo-blue" x1="0" y1="0" x2="0.75" y2="1"><stop offset="0" stop-color="#168FFF"/><stop offset="0.48" stop-color="#006DF2"/><stop offset="1" stop-color="#0751CB"/></linearGradient>
  <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FCFDFF"/></linearGradient>
  <g id="whatsapp-badge">
    <circle r="31" fill="url(#wa-green)" filter="url(#badge-shadow)"/>
    <circle cy="-0.5" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.1"/>
    <g transform="translate(-32 -32)">
      <path d="M32 12.5C21.2 12.5 12.5 21.2 12.5 32c0 3.9 1.2 7.7 3.3 10.9L12.2 52 21.6 49c3.1 1.7 6.6 2.6 10.4 2.6 10.8 0 19.5-8.7 19.5-19.5S42.8 12.5 32 12.5Z" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linejoin="round"/>
      <path d="M23.4 21.7c-.7-1.4-2.3-1.6-3.5-.3-1.4 1.6-1.6 4-.7 6.6 2.4 6.8 8.3 12.8 15.2 15.3 2.7 1.0 5.4 1 7.1-.3 1.7-1.3 1.6-3 .4-3.7l-5.6-3.1c-1-.5-1.6-.3-2.3.7l-1.2 1.5c-3.4-1.6-6.6-4.7-8.2-8.1l1.7-1.8c.6-.7.7-1.4.4-2.1Z" fill="#FFFFFF"/>
    </g>
  </g>
  <g id="zalo-badge">
    <circle r="31" fill="url(#zalo-blue)" filter="url(#badge-shadow)"/>
    <circle cy="-0.5" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="1.1"/>
    <g transform="translate(-32 -32)">
      <path d="M22 13.5h20c6.1 0 10.1 4.2 10.1 10.1V38c0 6.1-4.1 10-10.1 10H26.2l-12 4.1 3.4-10.3c-2.4-1.8-3.8-4.8-3.8-8.7v-9.5c0-5.9 3.6-10.1 8.2-10.1Z" fill="#FFFFFF"/>
      <text x="32.8" y="36.2" text-anchor="middle" font-size="15.6" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-0.85" fill="#0872F6">Zalo</text>
    </g>
  </g>
</defs>
<g id="unified-container" filter="url(#soft-shadow)">
<path d="M59 10H527c25 0 45 19.5 45 43.5S552 97 527 97H57l-26 10 7-19C26 80 18 68 18 53.5 18 29.5 36 10 59 10Z" fill="url(#shell)" stroke="#E7EBF1" stroke-width="1.1" stroke-linejoin="round"/>
</g>
<g id="chat-glyph" fill="none" stroke="#243A59" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
<path d="M56 37h19c7 0 11 4.8 11 11v9c0 6.2-4 11-11 11h-9l-10.5 7.5L57 67.5c-7 0-12-4.5-12-11V48c0-6.2 4.5-11 11-11Z"/>
</g>
<text id="label" x="102" y="62.8" fill="#24344A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="600" letter-spacing="-0.55">Chat with us:</text>
<path id="left-divider" d="M342 32v44" stroke="#DDE3EA" stroke-width="1.5" stroke-linecap="round"/>
<path id="right-divider" d="M458 32v44" stroke="#DDE3EA" stroke-width="1.5" stroke-linecap="round"/>
<g id="whatsapp" transform="translate(401 54)"><use xlink:href="#whatsapp-badge"/></g>
<g id="zalo" transform="translate(515 54)"><use xlink:href="#zalo-badge"/></g>
</svg>